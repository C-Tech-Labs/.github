name: Bug Report
description: Report a reproducible bug or regression.
title: "[BUG] <title>"
labels:
  - bug
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to fill out this bug report.
  - type: checkboxes
    id: search
    attributes:
      label: Checks
      description: Please confirm you have searched
      options:
        - label: I searched existing issues and did not find duplicates
          required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Describe your environment (OS, versions, etc.)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Please attach relevant logs or screenshots.
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - low
        - medium
        - high
        - critical
    validations:
      required: true
