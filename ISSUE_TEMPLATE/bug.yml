name: Bug Report
description: Report a reproducible bug or regression.
title: "[BUG] <title>"
labels:
  - bug
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to fill out this bug report. Please provide as much detail as possible so we can triage quickly.
  - type: checkboxes
    id: search
    attributes:
      label: Pre-flight checks
      description: Please confirm you have completed the following.
      options:
        - label: I searched existing issues and discussions and did not find duplicates
          required: true
        - label: I am not reporting a security vulnerability (see SECURITY.md for confidential reporting)
          required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Describe your environment (OS, runtime versions, package manager, deployment details).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the version number, tag, or commit SHA you are using.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this issue?
      options:
        - critical (production outage or data loss)
        - high (major degradation, no workaround)
        - medium (workaround exists)
        - low (minor issue)
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Impacted area
      description: Service, package, or component affected (e.g., API, UI, deployment, docs).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide a minimal, reliable set of steps to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Run '...'
        3. Observe '...'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Attach relevant logs, stack traces, or screenshots. Please sanitize sensitive data.
    validations:
      required: false
  - type: textarea
    id: regression
    attributes:
      label: Regression information
      description: Did this work previously? If so, what changed?
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Business impact
      description: Describe user impact, deadlines, or releases blocked by this issue.
    validations:
      required: false
