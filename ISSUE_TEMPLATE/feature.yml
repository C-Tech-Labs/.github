name: Feature Request
description: Suggest an improvement or new feature for C-Tech-Labs projects.
title: "[FEATURE] <title>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please focus on the user problem first. Well-scoped requests are easier to schedule and deliver.
  - type: checkboxes
    id: search
    attributes:
      label: Pre-flight checks
      options:
        - label: I have searched existing issues and discussions for similar requests.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user need or pain point are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goals and non-goals
      description: Define what success looks like and what is explicitly out of scope.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change you would like to see. Include APIs, UX flows, or configuration as relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you explored and why they were not chosen.
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Impact and urgency
      description: Who benefits from this feature? Is there a deadline or release dependency?
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List measurable outcomes or testable scenarios that define completion.
    validations:
      required: false
